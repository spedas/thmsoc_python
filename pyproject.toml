[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thmsoc-python"
version = "0.1.0"
description = "Python tools for the THEMIS SOC"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "pyspedas",
    "tomli",
    "obspy",
    "uv",
]

[project.scripts]
cdf_updater = "thmsoc.cli.cdf_updater:main"
product_volume = "thmsoc.cli.product_volume:main"
gen_l2_batches = "thmsoc.cli.gen_l2_batches:main"
gen_summary_plot_batches = "thmsoc.cli.gen_summary_plot_batches:main"
gmag_retrieve_usgs_variometer = "thmsoc.cli.gmag_retrieve_usgs_variometer:main"
gmag_retrieve_alternate = "thmsoc.cli.gmag_retrieve_alternate:main"
ip_owner_report = "thmsoc.cli.ip_owner_report:main"
ip_rdns_report = "thmsoc.cli.ip_rdns_report:main"
download_bz_recovery_data = "thmsoc.cli.download_bz_recovery_data:main"
gen_scmode_batches = "thmsoc.cli.gen_scmode_batches:main"

[project.urls]
Documentation = "https://thmsoc-python.readthedocs.io"
Repository = "https://github.com/spedas/thmsoc_python"
Issues = "https://github.com/spedas/thmsoc_python/issues"

[dependency-groups]
docs = [
    "sphinx>=7",
    "sphinx-argparse>=0.5",
    "sphinx-rtd-theme>=3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
